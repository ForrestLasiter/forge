name: CI

# Runs on every push and pull request. Two jobs, because they fail for different
# reasons and you want to know which:
#   verify  — does every reference solution still pass its own checker?
#   smoke   — does the packaged app actually open a window and work?

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify curriculum (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The Linux track's exercises run real shell commands, so the runner needs
      # the same tools a Kali box has. iproute2 supplies `ip`; without it the
      # networking exercise is skipped rather than failed, but we would rather
      # actually test it.
      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y iproute2

      - name: Install dependencies
        run: npm ci

      - name: Verify every reference solution
        run: npm test

      - name: Check the generated curriculum doc is current
        run: |
          npm run docs
          git diff --exit-code docs/CURRICULUM.md \
            || (echo "::error::docs/CURRICULUM.md is stale — run 'npm run docs' and commit the result." && exit 1)

  smoke:
    name: Launch the real app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Electron is Chromium, so a headless runner needs Chromium's shared
      # libraries plus a virtual X server. Package names drift between Ubuntu
      # releases (libasound2 became libasound2t64 in 24.04), hence the fallback.
      - name: Install Electron's runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libgtk-3-0t64 libgbm1 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 \
            || sudo apt-get install -y \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgtk-3-0 libgbm1 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Install dependencies
        run: npm ci

      - name: Build the interface
        run: npm run build

      # --no-sandbox because GitHub runners do not allow Chromium's user
      # namespace sandbox. On a real desktop the ./forge launcher tries the
      # secure path first and only falls back if the kernel refuses.
      - name: Smoke test (launch the window, drive the UI)
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" npx electron . --no-sandbox
        env:
          FORGE_SMOKE: '1'
